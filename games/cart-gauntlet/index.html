<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Cart Gauntlet">
<meta name="theme-color" content="#140a04">
<title>Cart Gauntlet</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<style>
  :root {
    --bg: #140a04;
    --wood: #5a3418;
    --wood-light: #8a5a30;
    --gold: #f6c445;
    --cream: #f3e2b8;
    --pad: min(44vmin, 200px);
    --jump: min(28vmin, 128px);
    --small: min(12vmin, 54px);
    --edge: 3vmin;
  }
  html, body {
    margin: 0;
    height: 100%;
    background: var(--bg);
    color: var(--cream);
    font: 600 16px/1.35 system-ui, -apple-system, "Segoe UI", sans-serif;
    overflow: hidden;
    touch-action: none;
    user-select: none;
    -webkit-user-select: none;
    -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent;
  }
  #screen {
    position: absolute;
    aspect-ratio: 256 / 224;
    image-rendering: pixelated;
    image-rendering: crisp-edges;
    background: #000;
  }
  @media (orientation: landscape) {
    #screen { height: 100%; left: 50%; top: 0; transform: translateX(-50%); }
  }
  @media (orientation: portrait) {
    #screen { width: 100%; left: 0; top: env(safe-area-inset-top); }
  }

  /* Touch controls (hidden until the device is known to have touch). */
  .ctl { position: absolute; display: none; touch-action: none; }
  body.touch .ctl { display: block; }
  #dpad {
    width: var(--pad); height: var(--pad);
    left: calc(env(safe-area-inset-left) + var(--edge));
    bottom: calc(env(safe-area-inset-bottom) + var(--edge));
    border-radius: 50%;
    background: radial-gradient(circle, rgba(255,255,255,.05) 0 55%, rgba(255,255,255,.1) 56% 70%, transparent 71%);
  }
  #dpad .bar {
    position: absolute; left: 50%; top: 50%;
    background: rgba(40, 22, 10, .85);
    border: 2px solid rgba(246, 196, 69, .55);
    border-radius: 14%;
  }
  #dpad .h { width: 86%; height: 32%; transform: translate(-50%, -50%); }
  #dpad .v { width: 32%; height: 86%; transform: translate(-50%, -50%); }
  #dpad .arrow {
    position: absolute; width: 0; height: 0; border: calc(var(--pad) * .07) solid transparent;
    opacity: .7;
  }
  #dpad .arrow.on { opacity: 1; filter: drop-shadow(0 0 6px var(--gold)); }
  #dpad .up { left: 50%; top: 13%; transform: translateX(-50%); border-bottom-color: var(--gold); border-top-width: 0; }
  #dpad .down { left: 50%; bottom: 13%; transform: translateX(-50%); border-top-color: var(--gold); border-bottom-width: 0; }
  #dpad .left { top: 50%; left: 13%; transform: translateY(-50%); border-right-color: var(--gold); border-left-width: 0; }
  #dpad .right { top: 50%; right: 13%; transform: translateY(-50%); border-left-color: var(--gold); border-right-width: 0; }
  #jump {
    width: var(--jump); height: var(--jump);
    right: calc(env(safe-area-inset-right) + var(--edge) * 2);
    bottom: calc(env(safe-area-inset-bottom) + var(--edge) * 2.5);
    border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #ffd86b, #d98a1c 60%, #8a4a0c);
    border: 3px solid rgba(255, 240, 200, .6);
    box-shadow: 0 6px 0 #4a2606, 0 8px 16px rgba(0,0,0,.5);
    color: #3a1d05; font-size: calc(var(--jump) * .2); font-weight: 800;
    display: none; place-items: center; letter-spacing: .05em;
  }
  body.touch #jump { display: grid; }
  #jump.on { transform: translateY(5px); box-shadow: 0 1px 0 #4a2606, 0 3px 8px rgba(0,0,0,.5); }
  .small {
    width: var(--small); height: var(--small);
    border-radius: 30%;
    background: rgba(40, 22, 10, .8);
    border: 2px solid rgba(246, 196, 69, .5);
    color: var(--gold);
    display: none; place-items: center;
    font-size: calc(var(--small) * .42);
  }
  body.touch .small { display: grid; }
  .small.on { background: rgba(246, 196, 69, .35); }
  .small svg { width: 55%; height: 55%; fill: currentColor; }
  #rewind { left: calc(env(safe-area-inset-left) + var(--edge)); top: calc(env(safe-area-inset-top) + var(--edge)); }
  #menu { right: calc(env(safe-area-inset-right) + var(--edge)); top: calc(env(safe-area-inset-top) + var(--edge)); }
  #pause { right: calc(env(safe-area-inset-right) + var(--edge) * 2 + var(--small)); top: calc(env(safe-area-inset-top) + var(--edge)); }
  @media (orientation: portrait) {
    /* Below the game picture. */
    #rewind, #menu, #pause { top: calc(env(safe-area-inset-top) + 100vw * 224 / 256 + var(--edge)); }
    /* Inside an arcade page, whose own button sits on the right edge halfway down. */
    body.embedded #menu { right: calc(env(safe-area-inset-right) + var(--edge) * 2 + var(--small)); }
    body.embedded #pause { right: calc(env(safe-area-inset-right) + var(--edge) * 3 + var(--small) * 2); }
  }
  #paused {
    position: absolute; left: 50%; top: 40%; transform: translate(-50%, -50%);
    padding: .4em 1em; border-radius: 8px; background: rgba(20,10,4,.85); color: var(--gold);
    font-size: 24px; letter-spacing: .1em; display: none; pointer-events: none;
  }

  /* Start-up overlay: ROM picker, then "tap to play". */
  #overlay {
    position: absolute; inset: 0; display: grid; place-items: center;
    background: repeating-linear-gradient(90deg, #3a2010 0 46px, #2a160a 46px 48px, #4a2a14 48px 94px, #2a160a 94px 96px);
    background-color: var(--bg);
    touch-action: auto;
    padding: 16px; box-sizing: border-box;
  }
  #overlay[hidden] { display: none; }
  .board {
    max-width: 440px; width: 100%; box-sizing: border-box;
    padding: 20px 22px; border-radius: 10px;
    background: linear-gradient(#7a4a24, #5a3418);
    border: 4px solid #c9a46a; outline: 3px solid #3a1d08;
    box-shadow: 0 10px 30px rgba(0,0,0,.6);
    text-align: center;
  }
  .board h1 {
    margin: 0 0 12px; color: var(--gold); font-size: 28px; letter-spacing: .06em;
    text-shadow: 0 2px 0 #3a1d05, 0 0 2px #3a1d05;
  }
  .board p { margin: 8px 0; }
  .roms { list-style: none; padding: 0; margin: 12px 0; text-align: left; }
  .roms li { padding: 4px 0; }
  .roms li::before { content: "\2717"; display: inline-block; width: 1.4em; color: #ff8a6a; }
  .roms li.ok::before { content: "\2713"; color: #9be36a; }
  .btn {
    display: inline-block; margin-top: 10px; padding: 12px 22px;
    border-radius: 999px; border: 2px solid #fff3c4;
    background: linear-gradient(#ffd86b, #d98a1c); color: #3a1d05;
    font: inherit; font-weight: 800; font-size: 18px; cursor: pointer;
  }
  .note { font-size: 13px; opacity: .85; }
  #error { color: #ffb4a0; }
</style>
</head>
<body>
<canvas id="screen" width="256" height="224"></canvas>

<div id="dpad" class="ctl" aria-label="Direction pad">
  <div class="bar h"></div><div class="bar v"></div>
  <div class="arrow up"></div><div class="arrow down"></div><div class="arrow left"></div><div class="arrow right"></div>
</div>
<div id="jump" class="ctl">JUMP</div>
<div id="rewind" class="ctl small" aria-label="Rewind (hold)">
  <svg viewBox="0 0 24 24"><path d="M11 6v12L2 12zM22 6v12l-9-6z"/></svg>
</div>
<div id="pause" class="ctl small" aria-label="Pause">
  <svg viewBox="0 0 24 24"><path d="M6 5h4v14H6zM14 5h4v14h-4z"/></svg>
</div>
<div id="menu" class="ctl small" aria-label="Back to menu">
  <svg viewBox="0 0 24 24"><path d="M4 6h16v2.5H4zM4 10.75h16v2.5H4zM4 15.5h16V18H4z"/></svg>
</div>
<div id="paused">PAUSED</div>

<div id="overlay">
  <div class="board" id="board">
    <h1>CART GAUNTLET</h1>
    <p id="status">Loading&hellip;</p>
  </div>
</div>

<input id="files" type="file" multiple accept=".sfc,.smc,application/octet-stream" hidden>
<script type="module" src="main.js"></script>
</body>
</html>
