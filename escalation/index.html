<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#FAF8F5">
    <title>Escalation · Yokocho Games</title>
    <meta name="description" content="A game of escalation.">
    <link rel="canonical" href="https://yokocho.games/escalation/">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <main class="feed" id="feed" tabindex="-1" aria-label="Games">
        <section class="slide welcome-slide active" data-index="-1" aria-label="Welcome">
            <div class="welcome-content">
                <h1>Yokocho Games</h1>
                <p>A cozy collection of games</p>
            </div>
            <div class="swipe-hint" aria-hidden="true">
                <svg class="chevron" viewBox="0 0 24 24" width="28" height="28"><path d="M6 15l6-6 6 6" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
                <span class="hint-touch">Swipe up to browse games</span>
                <span class="hint-pointer">Scroll or press &darr; to browse games</span>
            </div>
        </section>
        <!-- Game slides generated by JS -->
    </main>

    <nav class="feed-rail" aria-label="Browse games">
        <button class="rail-btn nav-prev" type="button" aria-label="Previous game" disabled>
            <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M6 15l6-6 6 6" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <div class="game-indicators" id="game-indicators">
            <!-- Dots generated by JS -->
        </div>
        <button class="rail-btn nav-next" type="button" aria-label="Next game">
            <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M6 9l6 6 6-6" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
    </nav>

    <button class="exit-play" id="exit-play" type="button" aria-label="Stop playing and browse games">
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M7 10l5-5 5 5M7 14l5 5 5-5" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <span>Games</span>
    </button>

    <script src="/js/navigation.js"></script>
</body>
</html>
