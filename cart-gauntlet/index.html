<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#0f0f14">
    <title>Cart Gauntlet · Yokocho Games</title>
    <meta name="description" content="Every mine cart, skull cart and rocket barrel stage from the Donkey Kong Country trilogy, back to back, in a homemade SNES emulator. Bring your own ROMs.">
    <link rel="canonical" href="https://yokocho.games/cart-gauntlet/">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <main class="feed" id="feed" tabindex="-1" aria-label="Games">
        <section class="slide welcome-slide active" data-index="-1" aria-label="Welcome">
            <div class="profile">
                <header class="profile-bar">
                    <span class="profile-handle">@yokocho.games</span>
                </header>

                <div class="profile-head">
                    <div class="avatar-ring">
                        <div class="avatar">
                            <svg viewBox="0 0 64 64" width="56" height="56" aria-hidden="true">
                                <path d="M32 6v6" stroke="#2a1414" stroke-width="3" stroke-linecap="round"/>
                                <rect x="22" y="11" width="20" height="5" rx="2" fill="#2a1414"/>
                                <ellipse cx="32" cy="33" rx="17" ry="18" fill="url(#lantern-fill)"/>
                                <path d="M16 27h32M15.5 33h33M16 39h32" stroke="#8e1d22" stroke-opacity=".45" stroke-width="1.5"/>
                                <rect x="22" y="49" width="20" height="5" rx="2" fill="#2a1414"/>
                                <path d="M32 54v5" stroke="#E8A598" stroke-width="2.5" stroke-linecap="round"/>
                                <defs>
                                    <radialGradient id="lantern-fill" cx=".5" cy=".42" r=".6">
                                        <stop offset="0" stop-color="#ffe2a8"/>
                                        <stop offset=".45" stop-color="#ff9a6a"/>
                                        <stop offset="1" stop-color="#c8342e"/>
                                    </radialGradient>
                                </defs>
                            </svg>
                        </div>
                    </div>
                    <h1 class="profile-name">Yokocho Games</h1>

                    <dl class="profile-stats">
                        <div><dt>Games</dt><dd id="stat-games">&ndash;</dd></div>
                        <div><dt>To play</dt><dd>Free</dd></div>
                        <div><dt>Installs</dt><dd>0</dd></div>
                    </dl>

                    <p class="profile-bio">A cozy collection of games 🏮<br>Swipe up to play, tap a game to jump in.</p>

                    <div class="profile-actions">
                        <button class="start-btn" type="button">
                            <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path d="M7 4.5v15l12.5-7.5z" fill="currentColor"/></svg>
                            Start playing
                        </button>
                        <button class="share-btn" type="button" aria-label="Share Yokocho Games">
                            <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M12 15V3m0 0L7.5 7.5M12 3l4.5 4.5M5 12v7a2 2 0 002 2h10a2 2 0 002-2v-7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
                        </button>
                    </div>
                </div>

                <div class="profile-tabs" aria-hidden="true">
                    <span class="profile-tab">
                        <svg viewBox="0 0 24 24" width="18" height="18"><path d="M3 3h7v7H3zM14 3h7v7h-7zM3 14h7v7H3zM14 14h7v7h-7z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg>
                        Games
                    </span>
                </div>

                <nav class="profile-grid" id="profile-grid" aria-label="All games">
                    <!-- Tiles generated by JS -->
                </nav>

                <div class="swipe-hint" aria-hidden="true">
                    <svg class="chevron" viewBox="0 0 24 24" width="24" height="24"><path d="M6 15l6-6 6 6" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
                    <span class="hint-touch">Swipe up to start</span>
                    <span class="hint-pointer">Scroll or press &darr; to start</span>
                </div>
            </div>
        </section>
        <!-- Game slides generated by JS -->
    </main>

    <nav class="feed-rail" aria-label="Browse games">
        <button class="rail-btn nav-prev" type="button" aria-label="Previous game" disabled>
            <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M6 15l6-6 6 6" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <div class="game-indicators" id="game-indicators">
            <!-- Dots generated by JS -->
        </div>
        <button class="rail-btn nav-next" type="button" aria-label="Next game">
            <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M6 9l6 6 6-6" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
    </nav>

    <button class="exit-play" id="exit-play" type="button" aria-label="Stop playing and browse games">
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M7 10l5-5 5 5M7 14l5 5 5-5" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <span>Games</span>
    </button>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>

    <script src="/js/navigation.js"></script>
</body>
</html>
